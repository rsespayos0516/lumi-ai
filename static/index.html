<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LUMI-AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f1117;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            background: #171923;
            border-right: 1px solid #2a2d3a;
            padding: 18px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, #9b5cff, #5c2cff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 19px;
        }

        .logo-name {
            font-size: 21px;
            font-weight: bold;
        }

        .new-chat {
            width: 100%;
            padding: 12px;
            border: 1px solid #383b4a;
            border-radius: 9px;
            background: #202330;
            color: white;
            cursor: pointer;
            font-size: 14px;
            text-align: left;
        }

        .new-chat:hover {
            background: #292d3d;
        }

        .sidebar-bottom {
            margin-top: auto;
            color: #9da1b2;
            font-size: 12px;
            line-height: 1.5;
        }

        /* MAIN */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            height: 64px;
            border-bottom: 1px solid #2a2d3a;
            display: flex;
            align-items: center;
            padding: 0 25px;
            font-weight: bold;
        }

        .topbar span {
            color: #a970ff;
            margin-left: 6px;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 150px;
        }

        .welcome {
            max-width: 760px;
            margin: 80px auto 30px;
            text-align: center;
        }

        .welcome-icon {
            width: 70px;
            height: 70px;
            margin: auto;
            border-radius: 22px;
            background: linear-gradient(135deg, #9b5cff, #5c2cff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        .welcome h1 {
            font-size: 34px;
            margin: 20px 0 10px;
        }

        .welcome p {
            color: #9da1b2;
            font-size: 16px;
        }

        .message {
            max-width: 850px;
            margin: 0 auto 22px;
            display: flex;
            gap: 12px;
        }

        .avatar {
            min-width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
        }

        .user .avatar {
            background: #303442;
        }

        .ai .avatar {
            background: linear-gradient(135deg, #9b5cff, #5c2cff);
        }

        .message-content {
            padding-top: 7px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* INPUT */
        .input-area {
            position: fixed;
            bottom: 0;
            left: 260px;
            right: 0;
            padding: 20px;
            background: linear-gradient(transparent, #0f1117 25%);
        }

        .input-box {
            max-width: 850px;
            margin: auto;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: #202330;
            border: 1px solid #3a3e4d;
            border-radius: 15px;
            padding: 10px 12px;
        }

        textarea {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 15px;
            min-height: 24px;
            max-height: 150px;
            font-family: inherit;
        }

        textarea::placeholder {
            color: #777c8e;
        }

        .send {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 10px;
            background: #8d4dff;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .send:hover {
            background: #a66aff;
        }

        .disclaimer {
            max-width: 850px;
            margin: 8px auto 0;
            text-align: center;
            color: #666b7c;
            font-size: 11px;
        }

        @media (max-width: 700px) {
            .sidebar {
                display: none;
            }

            .input-area {
                left: 0;
            }

            .welcome {
                margin-top: 50px;
            }

            .welcome h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">L</div>
            <div class="logo-name">LUMI-AI</div>
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ New chat
        </button>

        <div class="sidebar-bottom">
            LUMI-AI<br>
            Your personal AI assistant
        </div>

    </aside>

    <main class="main">

        <header class="topbar">
            LUMI<span>-AI</span>
        </header>

        <section class="chat" id="chat">

            <div class="welcome" id="welcome">

                <div class="welcome-icon">L</div>

                <h1>How can I help you?</h1>

                <p>
                    Welcome to LUMI-AI — your personal AI assistant.
                </p>

            </div>

        </section>

        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Message LUMI-AI..."
                    onkeydown="handleKey(event)"
                ></textarea>

                <button class="send" onclick="sendMessage()">
                    ↑
                </button>

            </div>

            <div class="disclaimer">
                LUMI-AI can make mistakes. Check important information.
            </div>

        </div>

    </main>

</div>

<script>

function handleKey(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
}

function addMessage(type, text) {

    const chat = document.getElementById("chat");

    const message = document.createElement("div");

    message.className = "message " + type;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = type === "user" ? "YOU" : "L";

    const content = document.createElement("div");
    content.className = "message-content";
    content.textContent = text;

    message.appendChild(avatar);
    message.appendChild(content);

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}

function sendMessage() {

    const input = document.getElementById("messageInput");
    const text = input.value.trim();

    if (!text) return;

    const welcome = document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    addMessage("user", text);

    input.value = "";

    /*
     * AI connection will be added in the next step.
     */

    setTimeout(() => {
        addMessage(
            "ai",
            "Hello! I'm LUMI-AI. My AI engine is being connected. Please stay tuned."
        );
    }, 500);
}

function newChat() {

    const chat = document.getElementById("chat");

    chat.innerHTML = `
        <div class="welcome" id="welcome">
            <div class="welcome-icon">L</div>
            <h1>How can I help you?</h1>
            <p>
                Welcome to LUMI-AI — your personal AI assistant.
            </p>
        </div>
    `;
}

</script>

</body>
</html>
